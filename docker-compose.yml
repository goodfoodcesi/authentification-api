services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: "authentificationapi"
      POSTGRES_PASSWORD: "authentificationapi"
      POSTGRES_DB: "authentificationapi"
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentificationapi"]
      interval: 10s
      timeout: 5s